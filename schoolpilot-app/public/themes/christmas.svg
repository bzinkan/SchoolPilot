<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A decorated Christmas tree beside a lit brick fireplace with stockings and a garland">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0a0a"/>
      <stop offset="1" stop-color="#6b1515"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5230"/>
      <stop offset="1" stop-color="#4a2d18"/>
    </linearGradient>
    <radialGradient id="fireglow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="brick" width="88" height="44" patternUnits="userSpaceOnUse">
      <rect width="88" height="44" fill="#7c2d12"/>
      <path d="M0 22 H88 M44 0 V22 M0 22 V44 M88 22 V44" stroke="#9a3412" stroke-width="4"/>
    </pattern>
    <g id="bulbs">
