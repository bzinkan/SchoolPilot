<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft pink background with a garden of wildflowers along the bottom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#f5e1dc"/>
    </linearGradient>
    <g id="daisy">
      <g fill="#ffffff" stroke="#e5e7eb" stroke-width="1">
        <ellipse cx="0" cy="-22" rx="8" ry="16"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(45)"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(90)"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(135)"/>
        <ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(180)"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(225)"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(270)"/><ellipse cx="0" cy="-22" rx="8" ry="16" transform="rotate(315)"/>
      </g>
