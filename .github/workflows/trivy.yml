name: Trivy Container Scan

# Free container vulnerability scanning. Builds the production Docker image and
# scans it for OS-level CVEs (Alpine packages) and language vulnerabilities.
# Runs on every push to main and weekly to catch new advisories on existing images.
#
# NOTE: this repo is private on a plan without code scanning, so there is no
# Security tab. Findings print as a table in the job log and FAIL the job
# (fixable CRITICAL/HIGH only). SOC 2 evidence: "we scan container images and
# block on fixable critical/high vulnerabilities".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'Dockerfile'
      - 'package*.json'
      - '.github/workflows/trivy.yml'
      - 'scripts/security/scan-container.mjs'
      - 'tests/trivy-container-scan.test.mjs'
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC

jobs:
  scan:
    name: Scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Test scan failure and database fallback contracts
        run: node --test tests/trivy-container-scan.test.mjs

      - name: Build image
        # Use the verified Node 22.23.4 security release for both FROM references.
        run: >-
          docker build
          --build-context node:22-alpine=docker-image://docker.io/library/node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
          -t schoolpilot-production-api:scan .

      - name: Install Trivy
        # Same installer commit and scanner version used by trivy-action v0.36.0.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true # binary only; databases must be downloaded in this run

      - name: Run Trivy with bounded database fallback
        # Download errors (including a mirror's terminal 404) are not scan verdicts.
        # The wrapper requires fresh vulnerability + Java databases, then scans once.
        run: node scripts/security/scan-container.mjs --image schoolpilot-production-api:scan
