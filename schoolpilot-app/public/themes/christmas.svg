    </g>
  </defs>
  <rect width="1920" height="1200" fill="url(#wall)"/>
  <rect y="980" width="1920" height="220" fill="url(#floor)"/>
  <g stroke="#3a2210" stroke-width="3" opacity="0.6"><path d="M0 1040 H1920 M0 1100 H1920 M0 1160 H1920"/></g>
  <g fill="#ffffff" opacity="0.5">
