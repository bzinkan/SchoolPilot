<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Green meadow with a rainbow, shamrocks and a pot of gold">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="0.5" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="bokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="leaflet" d="M0 7 C-5.5 2.5 -8 -1 -8 -4.5 C-8 -7.5 -5.5 -9.5 -3 -9.5 C-1.4 -9.5 0 -8.5 0 -7 C0 -8.5 1.4 -9.5 3 -9.5 C5.5 -9.5 8 -7.5 8 -4.5 C8 -1 5.5 2.5 0 7 Z"/>
    <g id="shamrock" fill="#15803d" stroke="#166534" stroke-width="0.6">
      <use href="#leaflet" transform="translate(20 19) rotate(0) translate(0 -8.5)"/>
      <use href="#leaflet" transform="translate(20 19) rotate(120) translate(0 -8.5)"/>
      <use href="#leaflet" transform="translate(20 19) rotate(240) translate(0 -8.5)"/>
      <path d="M20 22 Q23 30 19 37" stroke="#166534" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <g>
    <circle cx="300" cy="260" r="120" fill="url(#bokeh)"/><circle cx="900" cy="160" r="160" fill="url(#bokeh)"/><circle cx="1500" cy="320" r="140" fill="url(#bokeh)"/>
    <circle cx="640" cy="620" r="110" fill="url(#bokeh)"/><circle cx="1240" cy="700" r="130" fill="url(#bokeh)"/><circle cx="1800" cy="820" r="120" fill="url(#bokeh)"/>
  </g>
  <!-- rainbow -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M160 1000 A800 800 0 0 1 1760 1000" stroke="#ef4444" stroke-width="34"/>
    <path d="M194 1000 A766 766 0 0 1 1726 1000" stroke="#f97316" stroke-width="34"/>
    <path d="M228 1000 A732 732 0 0 1 1692 1000" stroke="#facc15" stroke-width="34"/>
    <path d="M262 1000 A698 698 0 0 1 1658 1000" stroke="#22c55e" stroke-width="34"/>
    <path d="M296 1000 A664 664 0 0 1 1624 1000" stroke="#3b82f6" stroke-width="34"/>
    <path d="M330 1000 A630 630 0 0 1 1590 1000" stroke="#a855f7" stroke-width="34"/>
  </g>
  <path d="M0 1000 Q480 940 960 1000 T1920 980 L1920 1200 L0 1200 Z" fill="#16a34a"/>
  <path d="M0 1090 Q480 1040 960 1090 T1920 1070 L1920 1200 L0 1200 Z" fill="#15803d"/>
  <!-- shamrocks -->
  <g>
    <use href="#shamrock" transform="translate(80 80) scale(3.2) rotate(-10)"/>
    <use href="#shamrock" transform="translate(260 40) scale(2) rotate(20)"/>
    <use href="#shamrock" transform="translate(1680 60) scale(3) rotate(15)"/>
    <use href="#shamrock" transform="translate(1800 260) scale(2.2) rotate(-25)"/>
    <use href="#shamrock" transform="translate(40 400) scale(2.4) rotate(30)"/>
    <use href="#shamrock" transform="translate(1760 520) scale(2.6) rotate(-12)"/>
    <use href="#shamrock" transform="translate(120 760) scale(2.8) rotate(10)"/>
    <use href="#shamrock" transform="translate(1660 780) scale(2.3) rotate(22)"/>
    <use href="#shamrock" transform="translate(560 880) scale(1.8) rotate(-18)"/>
    <use href="#shamrock" transform="translate(1180 900) scale(1.9) rotate(14)"/>
  </g>
  <!-- pot of gold -->
  <g transform="translate(1500 940)">
    <ellipse cx="0" cy="110" rx="130" ry="18" fill="#0f172a" opacity="0.25"/>
    <path d="M-110 0 Q-130 80 -70 110 L70 110 Q130 80 110 0 Z" fill="#1f2937"/>
    <ellipse cx="0" cy="0" rx="112" ry="26" fill="#111827"/>
    <g fill="#facc15" stroke="#ca8a04" stroke-width="2">
      <ellipse cx="-60" cy="-6" rx="22" ry="9"/><ellipse cx="-20" cy="-16" rx="22" ry="9"/><ellipse cx="22" cy="-10" rx="22" ry="9"/><ellipse cx="62" cy="-4" rx="22" ry="9"/>
      <ellipse cx="0" cy="-30" rx="22" ry="9"/><ellipse cx="-38" cy="-30" rx="20" ry="8"/><ellipse cx="40" cy="-26" rx="20" ry="8"/>
    </g>
  </g>
</svg>
