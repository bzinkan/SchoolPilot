[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
lib_deps =
    h2zero/NimBLE-Arduino@2.3.7
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/local_config.py
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
