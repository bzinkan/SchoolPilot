# Free dependency-update automation.
# Creates a PR per outdated package per week, grouped by ecosystem.
# Findings here become SOC 2 evidence ("we keep dependencies current").

version: 2
updates:
  # Backend (Node.js)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # Deliberate migrations, not weekly bumps: zod 4 rewrites error access in a
      # dozen route files and TypeScript majors are taken by hand (decisions of
      # 2026-09-17, #184 and #10); @types/node tracks the Node major the image
      # actually runs (22), so its majors move with the Dockerfile, not on their own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Frontend (Vite/React)
  - package-ecosystem: "npm"
    directory: "/schoolpilot-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Vite 8 (Rolldown) and its React plugin are a deliberate migration, not a
      # weekly bump (2026-09-17 decision).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # The router is exact-pinned as SOC 2 reachability evidence and is bumped
          # deliberately together with scripts/check-router-reachability.mjs,
          # scripts/frontend-dependency-audit.mjs and tests/frontend-dependency-audit.test.ts.
          - "react-router-dom"
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "ci"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Stay on the Node LTS line CI validates; a Node major is a deliberate move across
      # both Dockerfiles, every CI node-version pin and engines (2026-09-17 decision).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
