<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An autumn forest in orange and red with drifting leaves and pumpkins on the forest floor">
