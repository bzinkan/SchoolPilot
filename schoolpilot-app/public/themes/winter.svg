<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Blue winter night with falling snow, snowflakes, hanging ornaments and snowy pines">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <g id="flake" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 -30 V30 M-26 -15 L26 15 M-26 15 L26 -15"/>
      <path d="M0 -30 L-7 -22 M0 -30 L7 -22 M0 30 L-7 22 M0 30 L7 22 M-26 -15 L-16 -14 M-26 -15 L-24 -5 M26 15 L16 14 M26 15 L24 5 M-26 15 L-16 14 M-26 15 L-24 5 M26 -15 L16 -14 M26 -15 L24 -5"/>
    </g>
    <g id="ornament" stroke="#ffffff" stroke-width="4" fill="none">
      <rect x="-10" y="-14" width="20" height="12" rx="3"/><path d="M-8 -14 Q0 -30 8 -14"/>
      <circle cy="46" r="48"/><path d="M-48 46 Q0 20 48 46 M-48 46 Q0 72 48 46" opacity="0.7"/>
      <circle cy="46" r="10"/>
    </g>
    <g id="pine" fill="#1e3a8a">
      <path d="M0 -140 L60 -40 L30 -40 L80 40 L45 40 L100 140 L-100 140 L-45 40 L-80 40 L-30 -40 L-60 -40 Z"/>
      <path d="M0 -140 L40 -70 L-40 -70 Z M0 -70 L50 10 L-50 10 Z" fill="#e0f2fe" opacity="0.9"/>
    </g>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <g fill="none" stroke="#60a5fa" stroke-width="40" opacity="0.5" stroke-linecap="round">
    <path d="M-100 220 C300 60 700 380 1100 220 C1500 60 1800 300 2020 180"/>
    <path d="M-100 360 C400 200 800 520 1200 360 C1600 200 1800 420 2020 330" stroke="#93c5fd" stroke-width="24"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="120" cy="120" r="6"/><circle cx="260" cy="60" r="4"/><circle cx="380" cy="200" r="7"/><circle cx="560" cy="90" r="5"/><circle cx="700" cy="260" r="6"/><circle cx="880" cy="120" r="4"/>
    <circle cx="1020" cy="300" r="7"/><circle cx="1180" cy="80" r="5"/><circle cx="1340" cy="240" r="6"/><circle cx="1520" cy="130" r="4"/><circle cx="1680" cy="320" r="7"/><circle cx="1840" cy="90" r="5"/>
    <circle cx="200" cy="420" r="5"/><circle cx="460" cy="520" r="6"/><circle cx="640" cy="440" r="4"/><circle cx="820" cy="560" r="7"/><circle cx="1100" cy="480" r="5"/><circle cx="1260" cy="600" r="6"/>
    <circle cx="1440" cy="460" r="4"/><circle cx="1620" cy="560" r="7"/><circle cx="1800" cy="620" r="5"/><circle cx="80" cy="700" r="6"/><circle cx="940" cy="700" r="5"/><circle cx="1720" cy="760" r="6"/>
  </g>
  <g opacity="0.95">
    <use href="#flake" transform="translate(300 300) scale(1.6)"/><use href="#flake" transform="translate(1500 420) scale(1.3) rotate(20)"/><use href="#flake" transform="translate(900 180) scale(1.1) rotate(-15)"/>
    <use href="#flake" transform="translate(1800 220) scale(1.5) rotate(10)"/><use href="#flake" transform="translate(140 560) scale(1.2)"/><use href="#flake" transform="translate(1200 640) scale(1.4) rotate(30)"/>
  </g>
  <g>
    <path d="M220 0 V380 M1660 0 V520 M1790 0 V440" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <use href="#ornament" transform="translate(220 400) scale(1.4)"/>
    <use href="#ornament" transform="translate(1660 540) scale(1.1)"/>
    <use href="#ornament" transform="translate(1790 460) scale(0.9)"/>
  </g>
  <path d="M0 1010 Q480 960 960 1010 T1920 990 L1920 1200 L0 1200 Z" fill="#e0f2fe"/>
  <g opacity="0.85">
    <use href="#pine" transform="translate(120 920) scale(0.9)"/><use href="#pine" transform="translate(300 960) scale(0.6)"/><use href="#pine" transform="translate(1500 940) scale(0.8)"/><use href="#pine" transform="translate(1700 900) scale(1)"/><use href="#pine" transform="translate(1880 980) scale(0.6)"/>
  </g>
  <path d="M0 1100 Q480 1060 960 1100 T1920 1090 L1920 1200 L0 1200 Z" fill="#f0f9ff"/>
