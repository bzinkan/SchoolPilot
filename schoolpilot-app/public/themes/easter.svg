<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bright spring sky with sun rays over grass and decorated eggs">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <g id="egg">
      <path d="M0 -80 C-44 -80 -70 -16 -70 24 C-70 68 -38 96 0 96 C38 96 70 68 70 24 C70 -16 44 -80 0 -80 Z"/>
    </g>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <g stroke="#ffffff" stroke-width="40" opacity="0.18">
    <path d="M960 200 L960 -400 M960 200 L1500 -300 M960 200 L1800 100 M960 200 L1800 500 M960 200 L420 -300 M960 200 L120 100 M960 200 L120 500 M960 200 L1500 760 M960 200 L420 760"/>
  </g>
  <circle cx="960" cy="200" r="420" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="200" cy="300" r="40"/><circle cx="420" cy="180" r="26"/><circle cx="1500" cy="140" r="34"/><circle cx="1720" cy="380" r="28"/><circle cx="640" cy="520" r="22"/><circle cx="1300" cy="520" r="30"/>
  </g>
  <path d="M0 920 Q480 860 960 910 T1920 890 L1920 1200 L0 1200 Z" fill="url(#grass)"/>
  <!-- eggs -->
  <g transform="translate(360 1010) rotate(-12)"><use href="#egg" fill="#f472b6"/><g fill="#ffffff" opacity="0.85"><circle cx="-30" cy="-20" r="8"/><circle cx="20" cy="-40" r="8"/><circle cx="30" cy="20" r="8"/><circle cx="-20" cy="40" r="8"/><circle cx="0" cy="0" r="8"/></g></g>
  <g transform="translate(560 1030) rotate(6)"><use href="#egg" fill="#60a5fa"/><g stroke="#ffffff" stroke-width="10" fill="none" opacity="0.9"><path d="M-66 -10 Q0 -40 66 -10"/><path d="M-62 30 Q0 0 62 30"/><path d="M-50 66 Q0 40 50 66"/></g></g>
  <g transform="translate(1180 1020) rotate(-6)"><use href="#egg" fill="#facc15"/><g fill="#ffffff" opacity="0.9"><path d="M0 -40 L8 -18 L32 -16 L14 0 L20 24 L0 12 L-20 24 L-14 0 L-32 -16 L-8 -18 Z"/><circle cx="-36" cy="40" r="7"/><circle cx="36" cy="44" r="7"/></g></g>
  <g transform="translate(1400 1040) rotate(10)"><use href="#egg" fill="#a78bfa"/><g stroke="#ffffff" stroke-width="8" fill="none" opacity="0.9"><path d="M-60 -20 L-30 10 L0 -20 L30 10 L60 -20"/><path d="M-56 36 L-28 60 L0 36 L28 60 L56 36"/></g></g>
  <g transform="translate(1660 1000) rotate(-4)"><use href="#egg" fill="#34d399"/><g fill="#ffffff" opacity="0.9"><circle cx="0" cy="-30" r="10"/><circle cx="-34" cy="20" r="10"/><circle cx="34" cy="20" r="10"/><circle cx="0" cy="60" r="8"/></g></g>
  <!-- grass blades -->
  <g stroke="#166534" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M120 1110 Q130 1040 150 1000 M200 1120 Q190 1060 160 1020 M760 1100 Q770 1040 800 1000 M840 1110 Q830 1060 810 1030 M980 1120 Q990 1050 1020 1010 M1560 1110 Q1570 1050 1600 1010 M1860 1120 Q1850 1050 1820 1010"/>
  </g>
</svg>
