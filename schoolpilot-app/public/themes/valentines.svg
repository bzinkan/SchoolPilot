<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pink sky with paper hearts, heart balloons carrying gifts, and soft clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="0.55" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff1f2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff1f2" stop-opacity="0"/>
    </radialGradient>
    <path id="heart" d="M16 29 C8 22 2 17 2 10.5 C2 6 5.5 3 9.5 3 C12.3 3 14.6 4.6 16 7 C17.4 4.6 19.7 3 22.5 3 C26.5 3 30 6 30 10.5 C30 17 24 22 16 29 Z"/>
    <g id="gift">
      <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#ffffff"/>
      <rect x="-7" y="-30" width="14" height="60" fill="#e11d48"/>
      <rect x="-40" y="-6" width="80" height="12" fill="#e11d48"/>
      <path d="M-6 -30 C-16 -50 -30 -44 -18 -30 Z M6 -30 C16 -50 30 -44 18 -30 Z" fill="#e11d48"/>
    </g>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#light)"/>
  <g fill="#e11d48">
    <use href="#heart" transform="translate(120 140) scale(2.2) rotate(-12)"/>
    <use href="#heart" transform="translate(330 60) scale(1.3) rotate(10)"/>
    <use href="#heart" transform="translate(1680 90) scale(2.6) rotate(8)"/>
    <use href="#heart" transform="translate(1500 300) scale(1.4) rotate(-20)"/>
    <use href="#heart" transform="translate(80 520) scale(1.6) rotate(18)"/>
    <use href="#heart" transform="translate(1800 560) scale(1.9) rotate(-8)"/>
  </g>
  <g fill="#fb7185">
    <use href="#heart" transform="translate(240 300) scale(1.1) rotate(24)"/>
    <use href="#heart" transform="translate(1620 420) scale(1.2) rotate(-30)"/>
    <use href="#heart" transform="translate(1760 760) scale(1.1) rotate(14)"/>
    <use href="#heart" transform="translate(300 700) scale(1.3) rotate(-14)"/>
  </g>
  <!-- heart balloons with gifts -->
  <g>
    <path d="M1700 420 L1690 700 M1740 430 L1736 700 M1780 420 L1782 700" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <use href="#heart" transform="translate(1600 160) scale(8)" fill="#e11d48"/>
    <use href="#heart" transform="translate(1636 196) scale(6.4)" fill="#f43f5e" opacity="0.8"/>
    <use href="#gift" transform="translate(1736 740) scale(1.4)"/>
  </g>
  <g>
    <path d="M190 740 L182 940 M230 750 L226 940 M270 740 L272 940" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <use href="#heart" transform="translate(120 540) scale(6.5)" fill="#e11d48"/>
    <use href="#heart" transform="translate(150 570) scale(5)" fill="#f43f5e" opacity="0.8"/>
    <use href="#gift" transform="translate(226 980) scale(1.1)"/>
  </g>
  <!-- paper clouds -->
  <g fill="#fce7f3" opacity="0.95">
    <ellipse cx="300" cy="1120" rx="260" ry="90"/><ellipse cx="620" cy="1150" rx="300" ry="100"/><ellipse cx="980" cy="1110" rx="280" ry="95"/>
    <ellipse cx="1340" cy="1150" rx="320" ry="105"/><ellipse cx="1700" cy="1120" rx="280" ry="90"/><ellipse cx="60" cy="1170" rx="200" ry="80"/>
  </g>
  <g fill="#fdf2f8">
    <ellipse cx="460" cy="1170" rx="260" ry="80"/><ellipse cx="1150" cy="1180" rx="320" ry="90"/><ellipse cx="1820" cy="1180" rx="260" ry="80"/>
  </g>
</svg>
