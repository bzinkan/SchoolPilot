    </g>
    <path id="leaf" d="M0 0 C18 -8 30 -30 22 -50 C4 -42 -6 -22 0 0 Z"/>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7">
    <path d="M240 260 C260 220 300 220 320 260 C300 300 260 300 240 260 Z M320 260 C340 230 380 230 400 260 C380 290 340 290 320 260 Z"/>
    <path d="M1500 180 C1520 140 1560 140 1580 180 C1560 220 1520 220 1500 180 Z"/>
    <path d="M1300 420 C1320 380 1360 380 1380 420 C1360 460 1320 460 1300 420 Z M620 520 C640 480 680 480 700 520 C680 560 640 560 620 520 Z"/>
    <circle cx="1700" cy="500" r="4"/><circle cx="520" cy="360" r="4"/><circle cx="1100" cy="260" r="4"/><circle cx="900" cy="560" r="4"/>
  </g>
  <!-- stems -->
  <g stroke="#6b8f71" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M160 1200 C150 1080 170 1000 160 900"/><path d="M300 1200 C310 1100 290 1030 300 950"/><path d="M470 1200 C460 1120 480 1060 470 1000"/>
    <path d="M640 1200 C650 1080 630 1010 640 900"/><path d="M820 1200 C810 1130 830 1080 820 1010"/><path d="M1000 1200 C1010 1090 990 1020 1000 930"/>
    <path d="M1180 1200 C1170 1120 1190 1060 1180 990"/><path d="M1360 1200 C1370 1080 1350 1000 1360 920"/><path d="M1540 1200 C1530 1130 1550 1070 1540 1010"/>
    <path d="M1720 1200 C1730 1090 1710 1020 1720 940"/><path d="M1880 1200 C1870 1120 1890 1060 1880 1000"/><path d="M60 1200 C70 1110 50 1060 60 1010"/>
  </g>
  <g fill="#6b8f71">
    <use href="#leaf" transform="translate(162 1080) rotate(10)"/><use href="#leaf" transform="translate(298 1110) scale(-1 1) rotate(-10)"/><use href="#leaf" transform="translate(642 1070) rotate(8)"/>
    <use href="#leaf" transform="translate(998 1100) scale(-1 1)"/><use href="#leaf" transform="translate(1362 1090) rotate(12)"/><use href="#leaf" transform="translate(1718 1110) scale(-1 1) rotate(-6)"/>
    <use href="#leaf" transform="translate(822 1130) rotate(14)"/><use href="#leaf" transform="translate(1538 1120) scale(-1 1) rotate(-12)"/>
