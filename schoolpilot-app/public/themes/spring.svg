  <use href="#daisy" transform="translate(300 950)"/>
  <use href="#bell" transform="translate(470 1000)" fill="#60a5fa"/>
  <use href="#tulip" transform="translate(640 900) scale(1.1)" fill="#a78bfa"/>
  <use href="#bell" transform="translate(820 1010)" fill="#fbbf24"/>
  <use href="#daisy" transform="translate(1000 930) scale(1.2)"/>
